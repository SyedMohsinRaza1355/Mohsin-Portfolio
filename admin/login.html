<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/assets/admin/admin.css">
</head>
<body class="admin">
<form class="login" id="f">
  <h1>Admin</h1>
  <label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="btn primary" id="go" type="submit">Sign in</button>
  <div class="err-msg" id="err"></div>
</form>
<script type="module">
import { auth, signOut, ADMIN_UIDS } from "/assets/admin/guard.js";
import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const err = document.getElementById("err");
onAuthStateChanged(auth, (u) => { if (u && ADMIN_UIDS.includes(u.uid)) location.replace("/admin"); });
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault(); err.textContent = "";
  const btn = document.getElementById("go"); btn.disabled = true;
  try {
    const c = await signInWithEmailAndPassword(auth, e.value.trim(), p.value);
    if (!ADMIN_UIDS.includes(c.user.uid)) { await signOut(auth); throw new Error("x"); }
    location.replace("/admin");
  } catch { err.textContent = "Invalid email or password."; btn.disabled = false; }
});
</script>
</body>
</html>
